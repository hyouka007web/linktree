<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Alles über mich</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&family=Orbitron:wght@500;700&display=swap" rel="stylesheet">

  <style>
    @font-face {
      font-family: 'Lastica';
      src: url('lastica.ttf') format('truetype'),
           url('lastica.woff2') format('woff2');
      font-weight: normal;
      font-style: normal;
      font-display: swap;
    }

    body { 
      background-color: #121212; 
      color: #FAF6E6; 
      font-family: 'Lastica', 'Orbitron', 'Montserrat', sans-serif; 
      text-align: center; 
      margin: 0;
      padding: 40px 20px;
      overflow-x: hidden;
    } 

    .card-container {
      max-width: 420px;
      margin: 0 auto;
      position: relative;
    }

    /* === PROFILBEREICH MIT DREHENDEM NEON-RING === */
    .profil-bereich {
      position: relative;
      width: 130px;
      height: 130px;
      margin: 10px auto 20px auto;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .profil-huelle {
      position: relative;
      width: 104px;
      height: 104px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Drehender Kometen-Laserring */
    .profil-huelle::before {
      content: '';
      position: absolute;
      inset: -5px;
      border-radius: 50%;
      background: conic-gradient(
        from 0deg,
        #ff1e27 0%,
        #8b0000 30%,
        transparent 60%,
        #ff1e27 100%
      );
      animation: ring-drehen 2.5s linear infinite;
    }

    /* Äußerer Neon-Glow */
    .profil-huelle::after {
      content: '';
      position: absolute;
      inset: -5px;
      border-radius: 50%;
      background: conic-gradient(
        from 0deg,
        #ff1e27 0%,
        #8b0000 30%,
        transparent 60%,
        #ff1e27 100%
      );
      filter: blur(8px);
      opacity: 0.8;
      animation: ring-drehen 2.5s linear infinite;
    }

    @keyframes ring-drehen {
      0% {
        transform: rotate(0deg);
      }
      100% {
        transform: rotate(360deg);
      }
    }

    #profilbild {
      position: relative;
      width: 100px;
      height: 100px;
      border-radius: 50%;
      object-fit: cover;
      display: block;
      z-index: 2;
      border: 3px solid #121212; /* Schwarze Trennlinie zwischen Bild und Laserring */
    }

    h1 { 
      color: #ff1e27;
      font-size: 1.8rem;
      margin-top: 10px;
      margin-bottom: 8px;
      text-shadow: 0 0 12px rgba(255, 30, 39, 0.6);
      letter-spacing: 2px;
      text-transform: uppercase;
    } 

    .bio {
      color: #a0a0a0;
      font-size: 0.85rem;
      margin-bottom: 30px;
      letter-spacing: 1px;
    }

    /* KATEGORIEN-LAYOUT */
    .kategorie-container {
      display: flex;
      flex-direction: column;
      gap: 16px;
      position: relative;
      z-index: 4;
    }

    .kategorie-btn {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background-color: #1a1a1a;
      border: 1px solid #ff1e27;
      border-radius: 12px;
      padding: 16px 20px;
      color: #FAF6E6;
      font-family: inherit;
      font-weight: 700;
      font-size: 0.95rem;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 1px;
      transition: all 0.3s ease;
      box-shadow: 0 0 10px rgba(255, 30, 39, 0.15);
      box-sizing: border-box;
    }

    .kategorie-btn:hover {
      background-color: #261214;
      box-shadow: 0 0 15px rgba(255, 30, 39, 0.4);
      transform: translateY(-2px);
    }

    .pfeil {
      display: inline-block;
      transition: transform 0.3s ease;
      color: #ff1e27;
      font-size: 0.9rem;
    }

    .kategorie-btn.aktiv .pfeil {
      transform: rotate(90deg);
    }

    .kategorie-inhalt {
      max-height: 0;
      overflow: hidden;
      transition: max-height 0.4s ease-in-out, opacity 0.3s ease;
      opacity: 0;
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding-left: 10px;
    }

    .kategorie-inhalt.offen {
      max-height: 500px;
      opacity: 1;
      padding-top: 10px;
      padding-bottom: 5px;
    }

    .sub-link {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background-color: #161616;
      border: 1px solid #2a2a2a;
      border-radius: 8px;
      padding: 12px 16px;
      color: #d1d1d1;
      text-decoration: none;
      font-size: 0.85rem;
      font-weight: 600;
      letter-spacing: 0.5px;
      transition: all 0.25s ease;
    }

    .sub-link:hover {
      border-color: #ff1e27;
      color: #ffffff;
      background-color: #221516;
      transform: translateX(4px);
    }

    .sub-pfeil {
      color: #a0a0a0;
      font-size: 0.8rem;
    }

    .sub-link:hover .sub-pfeil {
      color: #ff1e27;
    }

    .sub-link.haupt-link {
      border-color: #ff1e27;
      background-color: #221214;
      color: #FAF6E6;
      font-weight: 700;
    }
  </style>
</head>
<body>

  <div class="card-container">

    <!-- PROFILBEREICH MIT ANIMATION -->
    <div class="profil-bereich">
      <div class="profil-huelle">
        <img src="profil.jpg" alt="Mein Profilbild" id="profilbild">
      </div>
    </div>

    <h1>Ice Cream</h1>
    <p class="bio">Projekte, Repositories & Profile</p>

    <!-- KATEGORIEN -->
    <div class="kategorie-container">

      <!-- GITHUB -->
      <div class="kategorie-item">
        <button class="kategorie-btn" onclick="toggleKategorie(this)">
          <span>GitHub</span>
          <span class="pfeil">▶</span>
        </button>
        <div class="kategorie-inhalt">
          <a href="https://github.com/hyouka007web" target="_blank" rel="noopener noreferrer" class="sub-link haupt-link">
            <span>GitHub Profil</span>
            <span class="sub-pfeil">→</span>
          </a>
          <a href="https://github.com/hyouka007web/NEXUS" target="_blank" rel="noopener noreferrer" class="sub-link">
            <span>Repository: NEXUS</span>
            <span class="sub-pfeil">→</span>
          </a>
          <a href="https://github.com/hyouka007web/Animem" target="_blank" rel="noopener noreferrer" class="sub-link">
            <span>Repository: Animem</span>
            <span class="sub-pfeil">→</span>
          </a>
          <a href="https://github.com/hyouka007web/NEXUS_Translator" target="_blank" rel="noopener noreferrer" class="sub-link">
            <span>Repository: NEXUS Translator</span>
            <span class="sub-pfeil">→</span>
          </a>
        </div>
      </div>

      <!-- WEBSEITEN -->
      <div class="kategorie-item">
        <button class="kategorie-btn" onclick="toggleKategorie(this)">
          <span>Webseiten</span>
          <span class="pfeil">▶</span>
        </button>
        <div class="kategorie-inhalt">
          <a href="https://hyouka007web.github.io/Animem/" target="_blank" rel="noopener noreferrer" class="sub-link">
            <span>Animem Webseite</span>
            <span class="sub-pfeil">→</span>
          </a>
        </div>
      </div>

      <!-- HOBBYS -->
      <div class="kategorie-item">
        <button class="kategorie-btn" onclick="toggleKategorie(this)">
          <span>Hobbys</span>
          <span class="pfeil">▶</span>
        </button>
        <div class="kategorie-inhalt">
          <a href="https://ranobedb.org/user/6599" target="_blank" rel="noopener noreferrer" class="sub-link">
            <span>RanobeDB Profil</span>
            <span class="sub-pfeil">→</span>
          </a>
          <a href="https://myanimelist.net" target="_blank" rel="noopener noreferrer" class="sub-link">
            <span>MyAnimeList</span>
            <span class="sub-pfeil">→</span>
          </a>
          <a href="https://music.youtube.com" target="_blank" rel="noopener noreferrer" class="sub-link">
            <span>YouTube Music</span>
            <span class="sub-pfeil">→</span>
          </a>
        </div>
      </div>

    </div>

  </div>

  <script>
    function toggleKategorie(button) {
      button.classList.toggle('aktiv');
      const inhalt = button.nextElementSibling;
      inhalt.classList.toggle('offen');
    }
  </script>

</body>
</html>
